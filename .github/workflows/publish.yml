# 쎈Clean 릴리스 게시: upload/v<버전> 브랜치에 올린 설치 파일·blockmap·latest.yml로 GitHub 릴리스를 만든다.
# (Claude 작업 환경은 릴리스를 직접 만들 수 없어서, 서명까지 마친 파일을 브랜치로 올리고 여기서 게시한다)
name: publish
on:
  push:
    branches: ['upload/**']
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 서명·파일 확인
        id: info
        run: node .github/verify-upload.js upload
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.info.outputs.version }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then echo "v$VER 릴리스가 이미 있어요"; exit 1; fi
          gh release create "v$VER" --target main --title "쎈Clean $VER" --notes-file upload/release-notes.md --latest \
            "upload/SenClean-Setup-$VER.exe" "upload/SenClean-Setup-$VER.exe.blockmap" upload/latest.yml
      - name: 올린 브랜치 지우기
        if: always()
        run: git push origin --delete "${GITHUB_REF_NAME}" || true
